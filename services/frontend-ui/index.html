<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NagarikBRICS Dashboard</title>
    
    <!-- STRICT SECURITY HEADERS -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://*.onrender.com; object-src 'none'; base-uri 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <header class="top-nav" role="banner">
        <div class="logo">
            <span class="logo-text">NagarikBRICS</span>
            <span class="logo-badge" aria-label="Digital Public Good">DPG</span>
        </div>
        <div class="nav-controls">
            <label for="country-selector" class="sr-only">Select Country</label>
            <select id="country-selector" class="select-dropdown" aria-label="Country Filter">
                <option value="">All BRICS Nations</option>
                <option value="BR">Brazil</option>
                <option value="RU">Russia</option>
                <option value="IN" selected>India</option>
                <option value="CN">China</option>
                <option value="ZA">South Africa</option>
            </select>
            <label for="language-selector" class="sr-only">Select Language</label>
            <select id="language-selector" class="select-dropdown" aria-label="Language Toggle">
                <option value="en">English (EN)</option>
                <option value="hi" selected>Hindi (HI)</option>
                <option value="pt">Portuguese (PT)</option>
                <option value="ru">Russian (RU)</option>
                <option value="zh">Chinese (ZH)</option>
            </select>
        </div>
    </header>

    <main class="dashboard-grid" role="main">
        
        <!-- SIDEBAR: CITIZEN SIMULATOR -->
        <aside class="panel panel-left" role="complementary" aria-labelledby="simulator-title">
            <h2 id="simulator-title" class="section-title">Citizen Simulator</h2>
            <form id="feedback-form" class="sim-form" novalidate aria-live="polite">
                
                <div class="form-group">
                    <label for="feedback-text">Multilingual Feedback</label>
                    <textarea id="feedback-text" name="raw_text" rows="4" aria-required="true" placeholder="e.g. हमारे गाँव में पिछले दो महीने से पानी नहीं आ रहा है।"></textarea>
                    <span id="text-error" class="error-msg" role="alert"></span>
                </div>

                <div class="form-group">
                    <label for="feedback-lat">Latitude</label>
                    <input type="number" id="feedback-lat" name="lat" step="any" aria-required="true" value="26.8467">
                </div>

                <div class="form-group">
                    <label for="feedback-lng">Longitude</label>
                    <input type="number" id="feedback-lng" name="lng" step="any" aria-required="true" value="80.9462">
                </div>

                <button type="submit" class="btn btn-primary" id="submit-feedback-btn">
                    Submit to Java Ingestion
                </button>
            </form>
            
            <div id="sim-status" class="status-panel" aria-live="assertive" role="region" aria-label="Submission Status">
                <!-- Status messages injected here -->
            </div>
        </aside>

        <!-- CENTER: HEATMAP CANVAS -->
        <section class="panel panel-center" aria-labelledby="heatmap-title">
            <div class="panel-header">
                <h2 id="heatmap-title" class="section-title">Policymaker Intelligence Canvas</h2>
                <button id="refresh-analysis-btn" class="btn btn-secondary">Refresh Analysis</button>
            </div>
            
            <div class="kpi-strip">
                <div class="kpi-card">
                    <div class="kpi-card__label">Total Feedback</div>
                    <div class="kpi-card__value" id="kpi-total">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-card__label">Critical Hotspots</div>
                    <div class="kpi-card__value" id="kpi-critical">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-card__label">New Recommendations</div>
                    <div class="kpi-card__value" id="kpi-recs">0</div>
                </div>
            </div>

            <!-- Pure HTML5/SVG Canvas for heatmap (Zero external map libraries) -->
            <div class="canvas-container" id="heatmap-container" role="img" aria-label="Interactive hotspot map">
                <svg id="heatmap-svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
                    <!-- Background Grid -->
                    <rect width="800" height="500" fill="var(--color-bg-primary)"/>
                    <g id="heatmap-grid" stroke="var(--color-border-primary)" stroke-width="1"></g>
                    <!-- Hotspot clusters injected here -->
                    <g id="hotspot-layer"></g>
                </svg>
            </div>
        </section>

        <!-- RIGHT: AI RECOMMENDATIONS -->
        <aside class="panel panel-right" role="region" aria-labelledby="recs-title">
            <h2 id="recs-title" class="section-title">AI Recommendation Feed</h2>
            <div id="recommendations-feed" class="recs-feed" aria-live="polite">
                <!-- ProjectRecommendation cards injected here -->
                <div class="empty-state">No recommendations generated yet.</div>
            </div>
        </aside>

    </main>

    <!-- FLOATING AI CHAT WIDGET -->
    <div id="ai-chat-widget" class="chat-widget" role="dialog" aria-label="AI Assistant Chat" aria-hidden="true">
        <div class="chat-header">
            <h3>AI Assistant</h3>
            <button id="close-chat-btn" aria-label="Close Chat">&times;</button>
        </div>
        <div id="chat-messages" class="chat-messages" aria-live="polite"></div>
        <form id="chat-form" class="chat-form">
            <input type="text" id="chat-input" placeholder="Ask about infrastructure..." aria-label="Chat Input" required minlength="2" maxlength="1000">
            <button type="submit" id="chat-send-btn" class="btn btn-primary" aria-label="Send Message">Send</button>
        </form>
    </div>
    
    <!-- Floating Action Button to open chat -->
    <button id="open-chat-btn" class="chat-fab" aria-label="Open AI Assistant Chat" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
            <path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/>
        </svg>
    </button>

    <script type="module" src="js/security.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
