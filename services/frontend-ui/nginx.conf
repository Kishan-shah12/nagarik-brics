# ==============================================================================
# NagarikBRICS — Nginx Configuration
# ==============================================================================

worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    sendfile on;
    keepalive_timeout 65;

    # Basic rate limiting zone for frontend assets
    limit_req_zone $binary_remote_addr zone=static_limit:10m rate=20r/s;

    server {
        # Running on 8080 to support non-root execution
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP is enforced via HTML meta tags per requirements, but good practice to add here too
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self';" always;

        location / {
            limit_req zone=static_limit burst=50 nodelay;
            try_files $uri $uri/ /index.html;
        }

        # Proxy to Java Ingestion Service
        location /api/v1/feedback/ {
            proxy_pass http://java-ingestion:8081/api/v1/feedback/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Proxy to Python AI Core Service
        location /api/v1/ai/ {
            proxy_pass http://python-ai-core:8080/api/v1/ai/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
